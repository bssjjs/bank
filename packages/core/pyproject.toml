[project]
name = "bank-core"
version = "0.1.0"
description = "口径规则、数据管道、指纹与冻结（不依赖训练与服务）"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bank"
module-root = "src"