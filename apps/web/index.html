<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="银行电话营销成交预测工作台" />
    <title>成交预测</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M6 10.5 16 5l10 5.5v11L16 27 6 21.5v-11Z" />
            <path d="m11 16 3.2 3.2L21 12.5" />
          </svg>
        </span>
        <span class="brand-name">成交预测</span>
      </div>
      <button class="service-status is-loading" id="service-status" type="button" aria-label="重新检查服务状态">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="service-status-text">连接中</span>
      </button>
    </header>

    <main class="workspace">
      <section class="panel input-panel" aria-labelledby="input-title">
        <div class="panel-heading">
          <span class="heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 4h14v16H5z" />
              <path d="M8 8h8M8 12h3M8 16h6" />
            </svg>
          </span>
          <div>
            <h1 id="input-title">项目信息</h1>
          </div>
          <span class="model-chip" id="model-version" hidden></span>
        </div>

        <div class="service-message" id="service-message" role="alert" hidden></div>

        <form id="predict-form" novalidate>
          <div class="form-loading" id="form-loading" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span>加载字段</span>
          </div>
          <div id="dynamic-fields" aria-busy="true"></div>
          <div class="form-error" id="form-error" role="alert" hidden></div>
          <div class="form-actions">
            <button class="predict-button" id="predict-button" type="submit" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" />
                <path d="m18.5 15 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" />
              </svg>
              <span>预测成交</span>
              <svg class="button-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14m-5-5 5 5-5 5" />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="panel-heading">
          <span class="heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 19V9m5 10V5m5 14v-7m5 7V3" />
            </svg>
          </span>
          <div>
            <h2 id="result-title">预测结果</h2>
          </div>
          <span class="result-state" id="result-state">待预测</span>
        </div>

        <div class="result-content" id="result-content" aria-live="polite">
          <div class="empty-state">
            <div class="empty-visual" aria-hidden="true">
              <span class="orbit orbit-outer"></span>
              <span class="orbit orbit-inner"></span>
              <svg viewBox="0 0 64 64" fill="none">
                <path d="M14 45V31m9 14V23m9 22V17m9 28V27m9 18V13" />
                <path d="M11 51h42" />
              </svg>
            </div>
            <span class="empty-label">待预测</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
