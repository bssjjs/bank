[project]
name = "bank-workspace"
version = "0.1.0"
description = "课程项目：银行电话营销外呼排序（口径 → 训练 → 服务 → 漂移）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bank-api",
    "bank-core",
    "bank-training",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/training", "packages/api"]

[tool.uv.sources]
bank-api = { workspace = true }
bank-core = { workspace = true }
bank-training = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12",
    # uv 自己也进声明：否则 uv sync 会把 .venv\Scripts\uv.exe 当成多余包删掉
    "uv>=0.13.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks 是分析过程的存档，不是生产代码；data/models 是产物；.tmp 是沙箱临时目录
exclude = [".venv", ".tmp", "data", "models", "notebooks", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ISC", "RUF"]
# 中文注释与文档全用全角标点，这正是想要的，不算"易混字符"
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["packages"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# scikit-learn 至今不带 py.typed，无法做类型检查；其余依赖都有 stub
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 工作区目录被沙箱 ACL 挡住写 .pytest_cache，缓存对本项目也没用
addopts = "-q -p no:cacheprovider"