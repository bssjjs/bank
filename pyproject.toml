[project]
name = "bank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Duliyang", email = "2101993750@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
bank = "bank:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ISC", "RUF"]
# 中文注释与文档全用全角标点，这正是想要的，不算"易混字符"
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# scikit-learn 至今不带 py.typed，无法做类型检查；其余依赖都有 stub
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
